name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # lrg needs Linux: its speed comes from io_uring.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Test
        run: cargo test --release
      - name: Build with profiling (hotpath)
        run: cargo build --release --features hotpath

  msrv:
    # The oldest Rust in Cargo.toml (`rust-version`) must still build it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
