[package]
name = "lrg"
version = "0.1.0"
edition = "2024"
description = "A recursive line searcher built on lio (io_uring)"
license = "MIT"
repository = "https://github.com/vincent-thomas/rip"
# The oldest Rust that builds it (the `ignore` crate needs 1.88).
rust-version = "1.88"

[dependencies]
# Pinned to the lio commit lrg was built and measured against.
lio = { git = "https://github.com/vincent-thomas/lio", rev = "deff8c1d7ed6c0bd52ad725f2e3d8acb44ccfb6c" }
regex = "1.12"
memchr = "2.7"
crossbeam-deque = "0.8"
ignore = "0.4"
# Profiling only: without the `hotpath` feature its macros do nothing.
hotpath = { version = "0.33", default-features = false }

# mimalloc is C code; WASI builds use the default allocator.
[target.'cfg(not(target_os = "wasi"))'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[features]
hotpath = ["hotpath/hotpath"]

[[bin]]
name = "lrg"
path = "src/main.rs"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
